spring:
  main:
    banner-mode: off
    allow-bean-definition-overriding: true

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${DISCOVERY_EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # 100% sample (chỉ nên dùng dev, prod thường 0.1 hoặc 0.05)
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

###---------------------------------------###
### Logging Configuration:
###---------------------------------------###
logging:
  level:
    root: info
