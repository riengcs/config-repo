spring:
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - info
          - health
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # 100% sample (chỉ nên dùng dev, prod thường 0.1 hoặc 0.05)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

###---------------------------------------###
### Logging Configuration:
###---------------------------------------###
logging:
  level:
    root: info
