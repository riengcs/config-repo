server:
  shutdown: graceful

spring:
  main:
    banner-mode: off
    allow-bean-definition-overriding: true
  messages:
    basename: config/i18n/messages
    fallback-to-system-locale: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:19092
  rabbitmq:
    addresses: localhost:5672
    username: guest
    password: guest
  cloud:
    bus:
      enabled: true
      destination: cloud-bus
    stream:
      default-binder: kafka # Allowed Value: [ rabbit, kafka ]
      kafka:
        binder:
          brokers: localhost:19092
          auto-create-topics: true
      rabbit:
        binder:
          admin-addresses: localhost:5672
      bindings:
        springCloudBusInput:
          group: ${spring.cloud.bus.destination}-${spring.application.instance_id:${random.uuid}}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - info
          - health
          - busrefresh
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0 # 100% sample (chỉ nên dùng dev, prod thường 0.1 hoặc 0.05)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

###---------------------------------------###
### Logging Configuration:
###---------------------------------------###
logging:
  level:
    root: info
    com.micro: debug
