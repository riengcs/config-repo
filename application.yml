spring:
  main:
    banner-mode: off
    allow-bean-definition-overriding: true

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${DISCOVERY_EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    ip-address: true

management:
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: 1.0
