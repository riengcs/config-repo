spring:
  datasource:
    url: jdbc:h2:mem:notificationdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    function:
      definition: notificationOrderConsumer
    stream:
      bindings:
        notificationOrderConsumer-in-0:
          destination: notification-order
          group: notification-service-notification-order
          consumer:
            auto-startup: true

app:
  info:
    name: ${spring.application.name}
